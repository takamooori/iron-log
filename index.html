// 栄養素計算
function calcNutrition(foodName, amount){
  const db = FOOD_NUTRITION_DB[foodName];
  if(!db) return { kcal:0, protein:0, fat:0, carb:0 };
  let grams = parseFloat(amount)||0;
  if(db.unit==="個"||db.unit==="本") grams = grams*(db.perUnitG||100);
  else if(db.unit==="ml") grams = grams; // mlをgとして近似
  const ratio = grams/100;
  return {
    kcal:    Math.round(db.kcal    * ratio * 10)/10,
    protein: Math.round(db.protein * ratio * 10)/10,
    fat:     Math.round(db.fat     * ratio * 10)/10,
    carb:    Math.round(db.carb    * ratio * 10)/10,
  };
}

// ─── Generic AutoComplete Input ───
function AutoCompleteInput({value, onChange, pool, placeholder}){
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  const suggestions = value.length===0
    ? pool.slice(0,8)
    : pool.filter(e=>e.includes(value)).slice(0,8);

  useEffect(()=>{
    const h=e=>{if(ref.current&&!ref.current.contains(e.target))setOpen(false)};
    document.addEventListener("mousedown",h);
    return()=>document.removeEventListener("mousedown",h);
  },[]);

  return React.createElement("div",{ref,style:{position:"relative"}},
    React.createElement("input",{className:"field-input",placeholder,value,
      onChange:e=>{onChange(e.target.value);setOpen(true)},
      onFocus:()=>setOpen(true),autoComplete:"off"}),
    open&&suggestions.length>0&&React.createElement("ul",{className:"suggest-list"},
      suggestions.map(s=>React.createElement("li",{key:s,className:"suggest-item",
        onMouseDown:()=>{onChange(s);setOpen(false)}},s)))
  );
}

function RecordForm({onSave}){
  const [exercise,setExercise]=useState("");
  const [rows,setRows]=useState([{weight:"",reps:""}]);
  const [saved,setSaved]=useState(false);
  function updateRow(i,field,val){setRows(prev=>prev.map((r,idx)=>idx===i?{...r,[field]:val}:r))}
  function addRow(){const last=rows[rows.length-1];setRows(prev=>[...prev,{weight:last.weight,reps:last.reps}])}
  function removeRow(i){if(rows.length===1)return;setRows(prev=>prev.filter((_,idx)=>idx!==i))}
  const grandTotal=rows.reduce((sum,r)=>{const w=parseFloat(r.weight),rp=parseInt(r.reps);return(w>0&&rp>0)?sum+w*rp:sum},0);
  function handleSave(){
    if(!exercise)return;
    const validSets=rows.filter(r=>parseFloat(r.weight)>0&&parseInt(r.reps)>0);
    if(validSets.length===0)return;
    const record={
      id:Date.now(),date:new Date().toISOString(),exercise,
      sets:validSets.map((r,i)=>({setNum:i+1,weight:parseFloat(r.weight),reps:parseInt(r.reps),total:parseFloat(r.weight)*parseInt(r.reps)})),
      weight:Math.max(...validSets.map(r=>parseFloat(r.weight))),
      total:validSets.reduce((s,r)=>s+parseFloat(r.weight)*parseInt(r.reps),0)
    };
    const all=loadWorkout();all.push(record);saveWorkout(all);onSave();
    setSaved(true);setExercise("");setRows([{weight:"",reps:""}]);
    setTimeout(()=>setSaved(false),1800);
  }
  return React.createElement("div",{className:"card"},
    React.createElement("div",{className:"card-header"},
      React.createElement("span",{className:"card-icon"},"✚"),
      React.createElement("span",{className:"card-title"},"トレーニング記録")),
    React.createElement("div",{className:"field-group",style:{marginBottom:16}},
      React.createElement("label",{className:"field-label"},"種目"),
      React.createElement(ExerciseInput,{value:exercise,onChange:setExercise})),
    React.createElement("div",{className:"set-header-row"},
      React.createElement("span",null),
      React.createElement("span",{className:"set-col-label"},"重量 kg"),
      React.createElement("span",{className:"set-col-label"},"レップス 回"),
      React.createElement("span",{className:"set-col-label set-subtotal-label"},"小計 kg"),
      React.createElement("span",{style:{width:28}})),
    rows.map((row,i)=>{
      const sub=(parseFloat(row.weight)>0&&parseInt(row.reps)>0)?(parseFloat(row.weight)*parseInt(row.reps)).toFixed(0):"—";
      return React.createElement("div",{key:i,className:"set-row"},
        React.createElement("span",{className:"set-num"},i+1),
        React.createElement("input",{className:"field-input set-input",type:"number",min:"0",step:"0.5",placeholder:"60",value:row.weight,onChange:e=>updateRow(i,"weight",e.target.value)}),
        React.createElement("input",{className:"field-input set-input",type:"number",min:"1",placeholder:"10",value:row.reps,onChange:e=>updateRow(i,"reps",e.target.value)}),
        React.createElement("span",{className:"set-subtotal"},sub),
        React.createElement("button",{className:"set-del-btn",onClick:()=>removeRow(i)},"✕"));
    }),
    React.createElement("button",{className:"add-set-btn",onClick:addRow},"＋ セットを追加"),
    React.createElement("div",{className:"total-bar"},
      React.createElement("span",{className:"total-label"},"総重量合計"),
      React.createElement("span",{className:"total-value"},
        grandTotal>0?grandTotal.toFixed(0):"—",
        React.createElement("span",{className:"unit"}," kg"))),
    React.createElement("button",{className:"save-btn"+(saved?" saved":""),onClick:handleSave},
      saved?"✓ 保存完了！":"保存する")
  );
}

function History({data,onDelete}){
  const now=new Date();
  const [year,setYear]=useState(now.getFullYear());
  const [month,setMonth]=useState(now.getMonth());
  const [selected,setSelected]=useState(null);
  const byDate={};
  data.forEach(r=>{
    const d=new Date(r.date);
    const key=`${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,"0")}/${String(d.getDate()).padStart(2,"0")}`;
    if(!byDate[key])byDate[key]=[];
    byDate[key].push(r);
  });
  const firstDay=new Date(year,month,1).getDay();
  const daysInMonth=new Date(year,month+1,0).getDate();
  const today=new Date();
  const isToday=(d)=>d===today.getDate()&&month===today.getMonth()&&year===today.getFullYear();
  function prevMonth(){if(month===0){setYear(y=>y-1);setMonth(11)}else setMonth(m=>m-1)}
  function nextMonth(){if(month===11){setYear(y=>y+1);setMonth(0)}else setMonth(m=>m+1)}
  function getKey(d){return`${year}/${String(month+1).padStart(2,"0")}/${String(d).padStart(2,"0")}`}
  function getIntensity(d){
    const recs=byDate[getKey(d)];
    if(!recs)return 0;
    return recs.length>=3?3:recs.length>=2?2:1;
  }
  const monthNames=["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"];
  const dayNames=["日","月","火","水","木","金","土"];
  const cells=[];
  for(let i=0;i<firstDay;i++)cells.push(null);
  for(let d=1;d<=daysInMonth;d++)cells.push(d);
  if(!data.length)return React.createElement("div",{className:"card empty-card"},
    React.createElement("div",{className:"empty-icon"},"📅"),
    React.createElement("p",{className:"empty-text"},"まだ記録がありません"),
    React.createElement("p",{className:"empty-sub"},"記録タブからトレーニングを追加してみよう"));
  return React.createElement("div",{className:"history-wrap"},
    React.createElement("div",{className:"cal-header"},
      React.createElement("button",{className:"cal-nav-btn",onClick:prevMonth},"‹"),
      React.createElement("span",{className:"cal-month-label"},`${year}年 ${monthNames[month]}`),
      React.createElement("button",{className:"cal-nav-btn",onClick:nextMonth},"›")),
    React.createElement("div",{className:"cal-grid"},
      dayNames.map(d=>React.createElement("div",{key:d,className:"cal-dow"},d)),
      cells.map((d,i)=>{
        if(d===null)return React.createElement("div",{key:`e${i}`,className:"cal-cell cal-empty"});
        const intensity=getIntensity(d);
        const key=getKey(d);
        const active=selected===key;
        return React.createElement("div",{
          key:d,className:`cal-cell${intensity>0?" cal-has-rec":""}${isToday(d)?" cal-today":""}${active?" cal-selected":""}`,
          "data-intensity":intensity,onClick:()=>{if(intensity>0)setSelected(key)}},
          React.createElement("span",{className:"cal-day-num"},d),
          intensity>0&&React.createElement("div",{className:`cal-dot cal-dot-${intensity}`}));
      })),
    React.createElement("div",{className:"cal-legend"},
      React.createElement("span",{className:"cal-legend-label"},"記録数:"),
      [1,2,3].map(i=>React.createElement("div",{key:i,className:"cal-legend-item"},
        React.createElement("div",{className:`cal-dot cal-dot-${i}`}),
        React.createElement("span",null,i===1?"1件":i===2?"2件":"3件+")))),
    selected&&byDate[selected]&&React.createElement(DayModal,{
      date:selected,records:byDate[selected],
      onDelete:(id)=>{onDelete(id);if(!byDate[selected]||byDate[selected].length<=1)setSelected(null)},
      onClose:()=>setSelected(null)
    })
  );

function MealRecord({onSave}){
  const initSlots = ()=>Object.fromEntries(MEAL_TIMES.map(t=>[t.id,[{food:"",amount:""}]]));
  const [slots, setSlots] = useState(initSlots);
  const [saved, setSaved] = useState(false);

  function updateRow(timeId, idx, patch){
    setSlots(prev=>({...prev,
      [timeId]: prev[timeId].map((r,i)=>i===idx?{...r,...patch}:r)
    }));
  }
  function addRow(timeId){
    setSlots(prev=>({...prev,[timeId]:[...prev[timeId],{food:"",amount:""}]}));
  }
  function removeRow(timeId, idx){
    setSlots(prev=>{
      const arr=prev[timeId];
      if(arr.length<=1)return {...prev,[timeId]:[{food:"",amount:""}]};
      return {...prev,[timeId]:arr.filter((_,i)=>i!==idx)};
    });
  }

  const allTotals = Object.values(slots).flat().reduce((acc,r)=>{
    const n=r.food&&r.amount?calcNutrition(r.food,r.amount):{kcal:0,protein:0,fat:0,carb:0};
    return {kcal:acc.kcal+n.kcal, protein:acc.protein+n.protein, fat:acc.fat+n.fat, carb:acc.carb+n.carb};
  },{kcal:0,protein:0,fat:0,carb:0});

  function handleSave(){
    const items = [];
    MEAL_TIMES.forEach(t=>{
      slots[t.id].forEach(r=>{
        if(r.food&&parseFloat(r.amount)>0){
          const n=calcNutrition(r.food,r.amount);
          items.push({timeId:t.id,food:r.food,amount:parseFloat(r.amount),
            unit:FOOD_NUTRITION_DB[r.food]?.unit||"g",...n});
        }
      });
    });
    if(!items.length)return;
    const record={id:Date.now(),date:new Date().toISOString(),items,
      totals:{kcal:Math.round(allTotals.kcal),protein:Math.round(allTotals.protein*10)/10,
              fat:Math.round(allTotals.fat*10)/10,carb:Math.round(allTotals.carb*10)/10}};
    const all=loadMeals();all.push(record);saveMeals(all);onSave();
    setSaved(true);setSlots(initSlots());
    setTimeout(()=>setSaved(false),1800);
  }

  const hasAny = Object.values(slots).flat().some(r=>r.food&&parseFloat(r.amount)>0);

  return React.createElement("div",{className:"meal-record-wrap"},
    React.createElement("div",{className:"card",style:{marginBottom:12}},

      React.createElement("div",{className:"meal-day-total"},
        React.createElement("div",{className:"mdt-left"},
          React.createElement("span",{className:"mdt-label"},"本日の合計"),
          React.createElement("span",{className:"mdt-kcal"},Math.round(allTotals.kcal),React.createElement("span",{className:"mdt-unit"},"kcal"))),
        React.createElement("div",{className:"mdt-macros"},
          React.createElement("div",{className:"mdt-macro"},
            React.createElement("span",{className:"mdt-macro-val macro-p-val"},allTotals.protein.toFixed(1)),
            React.createElement("span",{className:"mdt-macro-label"},"P")),
          React.createElement("div",{className:"mdt-macro"},
            React.createElement("span",{className:"mdt-macro-val macro-f-val"},allTotals.fat.toFixed(1)),
            React.createElement("span",{className:"mdt-macro-label"},"F")),
          React.createElement("div",{className:"mdt-macro"},
            React.createElement("span",{className:"mdt-macro-val macro-c-val"},allTotals.carb.toFixed(1)),
            React.createElement("span",{className:"mdt-macro-label"},"C"))))),

    MEAL_TIMES.map(t=>React.createElement(MealTimeBlock,{
      key:t.id, timeSlot:t,

function MealHistory({data,onDelete}){
  const now=new Date();
  const [year,setYear]=useState(now.getFullYear());
  const [month,setMonth]=useState(now.getMonth());
  const [selected,setSelected]=useState(null);

  const byDate={};
  data.forEach(r=>{
    const d=new Date(r.date);
    const key=`${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,"0")}/${String(d.getDate()).padStart(2,"0")}`;
    if(!byDate[key])byDate[key]=[];
    byDate[key].push(r);

  const firstDay=new Date(year,month,1).getDay();
  const daysInMonth=new Date(year,month+1,0).getDate();
  const today=new Date();
  const isToday=(d)=>d===today.getDate()&&month===today.getMonth()&&year===today.getFullYear();
  function prevMonth(){if(month===0){setYear(y=>y-1);setMonth(11)}else setMonth(m=>m-1)}

  function getKey(d){return`${year}/${String(month+1).padStart(2,"0")}/${String(d).padStart(2,"0")}`}

  const monthNames=["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"];
  const dayNames=["日","月","火","水","木","金","土"];
