// ─── Workout data ───
const PRESET_EXERCISES = [
  "ベンチプレス","インクラインベンチプレス","ダンベルフライ","ケーブルクロスオーバー",
  "スクワット","レッグプレス","レッグカール","レッグエクステンション","ブルガリアンスクワット",
  "デッドリフト","ルーマニアンデッドリフト","懸垂","ラットプルダウン","シーテッドロウ",
  "ショルダープレス","サイドレイズ","フロントレイズ","フェイスプル",
  "バーベルカール","ハンマーカール","トライセプスプレスダウン","スカルクラッシャー",
  "プランク","クランチ","レッグレイズ","ヒップスラスト","カーフレイズ"
];

const STORAGE_KEY_WORKOUT = "workout_log_v2";
const STORAGE_KEY_MEAL    = "meal_log_v1"; // 旧・食事データ(バックアップ対象として保持)

function loadWorkout(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY_WORKOUT)||"[]")}catch{return[]}}
function saveWorkout(d){localStorage.setItem(STORAGE_KEY_WORKOUT,JSON.stringify(d))}
function loadMeals(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY_MEAL)||"[]")}catch{return[]}}

function formatDate(iso){const d=new Date(iso);return`${d.getMonth()+1}/${d.getDate()}`}
function formatDateFull(iso){const d=new Date(iso);return`${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,"0")}/${String(d.getDate()).padStart(2,"0")}`}

// ─── 体組成データ ───
const STORAGE_KEY_BODY = "body_log_v1";
const STORAGE_KEY_BODY_PROFILE = "body_profile_v1"; // {height}
function loadBody(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY_BODY)||"[]")}catch{return[]}}
function saveBody(d){localStorage.setItem(STORAGE_KEY_BODY,JSON.stringify(d))}
function loadBodyProfile(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY_BODY_PROFILE)||"{}")}catch{return{}}}
function saveBodyProfile(p){localStorage.setItem(STORAGE_KEY_BODY_PROFILE,JSON.stringify(p))}
function dateToStr(d){return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function todayStr(){return dateToStr(new Date())}
function fmtMD(dateStr){const p=dateStr.split("-");return`${parseInt(p[1])}/${parseInt(p[2])}`}
function daysBeforeStr(baseDateStr,days){const d=new Date(baseDateStr+"T00:00:00");d.setDate(d.getDate()-days);return dateToStr(d)}

// 最新値と「N日前(以前で最も近い記録)」の差分。記録が足りなければ最古と比較、それも無ければnull
function bodyDelta(entries,getVal,daysBefore){
  const withVal=entries.filter(e=>typeof getVal(e)==="number"&&!isNaN(getVal(e))).sort((a,b)=>a.date<b.date?-1:1);
  if(withVal.length<2)return null;
  const latest=withVal[withVal.length-1];
  const targetStr=daysBeforeStr(latest.date,daysBefore);
  let past=null;
  for(let i=withVal.length-2;i>=0;i--){if(withVal[i].date<=targetStr){past=withVal[i];break}}
  if(!past)past=withVal[0];
  if(past.date===latest.date)return null;
  const from=getVal(past),to=getVal(latest);
  return {diff:to-from,pct:from!==0?(to-from)/from*100:0,fromDate:past.date};
}

// 日付ベースの移動平均(直近windowDays日間の平均)
function withMovingAvg(points,windowDays){
  return points.map(p=>{
    const fromStr=daysBeforeStr(p.date,windowDays-1);
    const win=points.filter(q=>q.date>=fromStr&&q.date<=p.date);
    const avg=win.reduce((s,q)=>s+q.value,0)/win.length;
    return {...p,avg:Math.round(avg*100)/100};
  });
}

// ─── e1RM (Epley式: w × (1 + reps/30)) ───
function e1rm(weight,reps){
  if(!(weight>0&&reps>0))return 0;
  if(reps===1)return weight;
  return weight*(1+reps/30);
}
function recordBestE1rm(rec){
  const sets=rec.sets||[{weight:rec.weight,reps:rec.reps}];
  let best=0,bestSet=null;
  sets.forEach(s=>{const v=e1rm(s.weight,s.reps);if(v>best){best=v;bestSet=s}});
  return {value:best,set:bestSet};
}
// 指定種目の過去ベスト(excludeId を除く)
function bestE1rmFor(data,exercise,excludeId){
  let best=0,bestRec=null,bestSet=null;
  data.forEach(r=>{
    if(r.exercise!==exercise)return;
    if(excludeId!=null&&r.id===excludeId)return;
    const b=recordBestE1rm(r);
    if(b.value>best){best=b.value;bestRec=r;bestSet=b.set}
  });
  return {value:best,record:bestRec,set:bestSet};
}

function ExerciseInput({value,onChange}){
  const usedExercises=[...new Set(loadWorkout().map(r=>r.exercise))];
  const pool=[...new Set([...usedExercises,...PRESET_EXERCISES])];
  const [open,setOpen]=useState(false);
  const ref=useRef(null);
  const suggestions=value.length===0?pool.slice(0,8):pool.filter(e=>e.includes(value)).slice(0,8);
  useEffect(()=>{
    const h=e=>{if(ref.current&&!ref.current.contains(e.target))setOpen(false)};
    document.addEventListener("mousedown",h);return()=>document.removeEventListener("mousedown",h);
  },[]);
  return React.createElement("div",{ref,style:{position:"relative"}},
    React.createElement("input",{className:"field-input",placeholder:"例：ベンチプレス",value,
      onChange:e=>{onChange(e.target.value);setOpen(true)},onFocus:()=>setOpen(true),autoComplete:"off"}),
    open&&suggestions.length>0&&React.createElement("ul",{className:"suggest-list"},
      suggestions.map(s=>React.createElement("li",{key:s,className:"suggest-item",
        onMouseDown:()=>{onChange(s);setOpen(false)}},
        usedExercises.includes(s)
          ?[React.createElement("span",{key:"b",className:"suggest-badge"},"履歴"),s]
          :s)))
  );
}

// ─── セット入力行(±ボタン付き・記録と編集で共用) ───
function stepWeight(cur,delta){
  const w=parseFloat(cur);
  const base=isNaN(w)?0:w;
  const next=Math.max(0,base+delta);
  return next===0?"":String(Math.round(next*100)/100);
}
function SetRowEditor({row,index,onChange,onRemove,canRemove}){
  const sub=(parseFloat(row.weight)>0&&parseInt(row.reps)>0)?(parseFloat(row.weight)*parseInt(row.reps)).toFixed(0):"—";
  return React.createElement("div",{className:"set-row2"},
    React.createElement("span",{className:"set-num"},index+1),
    React.createElement("div",{className:"set-row2-main"},
      React.createElement("div",{className:"stepper-row"},
        React.createElement("button",{className:"step-btn",onClick:()=>onChange({...row,weight:stepWeight(row.weight,-10)})},"−10"),
        React.createElement("button",{className:"step-btn",onClick:()=>onChange({...row,weight:stepWeight(row.weight,-5)})},"−5"),
        React.createElement("input",{className:"field-input weight-input",type:"number",inputMode:"decimal",min:"0",step:"0.5",placeholder:"60",value:row.weight,
          onChange:e=>onChange({...row,weight:e.target.value})}),
        React.createElement("span",{className:"step-unit"},"kg"),
        React.createElement("button",{className:"step-btn step-plus",onClick:()=>onChange({...row,weight:stepWeight(row.weight,5)})},"+5"),
        React.createElement("button",{className:"step-btn step-plus",onClick:()=>onChange({...row,weight:stepWeight(row.weight,10)})},"+10")),
      React.createElement("div",{className:"reps-sub-row"},
        React.createElement("input",{className:"field-input reps-input",type:"number",inputMode:"numeric",min:"1",placeholder:"10",value:row.reps,
          onChange:e=>onChange({...row,reps:e.target.value})}),
        React.createElement("span",{className:"step-unit"},"回"),
        React.createElement("span",{className:"set-subtotal"},"小計 "+sub+" kg"))),
    React.createElement("button",{className:"set-del-btn",onClick:onRemove,disabled:!canRemove},"✕"));
}

// レコード保存用: rows → record.sets 等を組み立て
function buildSets(rows){
  const validSets=rows.filter(r=>parseFloat(r.weight)>0&&parseInt(r.reps)>0);
  return validSets.map((r,i)=>({setNum:i+1,weight:parseFloat(r.weight),reps:parseInt(r.reps),total:parseFloat(r.weight)*parseInt(r.reps)}));
}

function RecordForm({onSave}){
  const [exercise,setExercise]=useState("");
  const [rows,setRows]=useState([{weight:"",reps:""}]);
  const [savedMsg,setSavedMsg]=useState(null); // null | {pr:boolean, text}
  function updateRow(i,next){setRows(prev=>prev.map((r,idx)=>idx===i?next:r))}
  function addRow(){const last=rows[rows.length-1];setRows(prev=>[...prev,{weight:last.weight,reps:last.reps}])}
  function removeRow(i){if(rows.length===1)return;setRows(prev=>prev.filter((_,idx)=>idx!==i))}
  const grandTotal=rows.reduce((sum,r)=>{const w=parseFloat(r.weight),rp=parseInt(r.reps);return(w>0&&rp>0)?sum+w*rp:sum},0);
  function handleSave(){
    if(!exercise)return;
    const sets=buildSets(rows);
    if(sets.length===0)return;
    const record={
      id:Date.now(),date:new Date().toISOString(),exercise,sets,
      weight:Math.max(...sets.map(s=>s.weight)),
      total:sets.reduce((s,r)=>s+r.total,0)
    };
    const all=loadWorkout();
    // PR判定(保存前の過去ベストと比較)
    const prevBest=bestE1rmFor(all,exercise,null).value;
    const thisBest=recordBestE1rm(record).value;
    const isPR=prevBest>0&&thisBest>prevBest;
    all.push(record);saveWorkout(all);onSave();
    setSavedMsg(isPR?{pr:true,text:`🎉 e1RM更新！ ${thisBest.toFixed(1)}kg (前回 ${prevBest.toFixed(1)}kg)`}:{pr:false,text:"✓ 保存完了！"});
    setExercise("");setRows([{weight:"",reps:""}]);
    setTimeout(()=>setSavedMsg(null),isPR?3500:1800);
  }
  return React.createElement("div",{className:"card"},
    React.createElement("div",{className:"card-header"},
      React.createElement("span",{className:"card-icon"},"✚"),
      React.createElement("span",{className:"card-title"},"トレーニング記録")),
    React.createElement("div",{className:"field-group",style:{marginBottom:16}},
      React.createElement("label",{className:"field-label"},"種目"),
      React.createElement(ExerciseInput,{value:exercise,onChange:setExercise})),
    rows.map((row,i)=>React.createElement(SetRowEditor,{
      key:i,row,index:i,
      onChange:next=>updateRow(i,next),
      onRemove:()=>removeRow(i),
      canRemove:rows.length>1})),
    React.createElement("button",{className:"add-set-btn",onClick:addRow},"＋ セットを追加"),
    React.createElement("div",{className:"total-bar"},
      React.createElement("span",{className:"total-label"},"総重量合計"),
      React.createElement("span",{className:"total-value"},
        grandTotal>0?grandTotal.toFixed(0):"—",
        React.createElement("span",{className:"unit"}," kg"))),
    React.createElement("button",{className:"save-btn"+(savedMsg?(savedMsg.pr?" saved-pr":" saved"):""),onClick:handleSave},
      savedMsg?savedMsg.text:"保存する")
  );
}

// ─── バックアップ(エクスポート/インポート) ───
function BackupCard({onImported}){
  const fileRef=useRef(null);
  const [msg,setMsg]=useState("");
  function doExport(){
    const payload={app:"iron-log",version:2,exportedAt:new Date().toISOString(),
      workout:loadWorkout(),body:loadBody(),bodyProfile:loadBodyProfile(),meal:loadMeals()};
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    const d=new Date(),ds=`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}`;
    a.href=url;a.download=`iron-log-backup-${ds}.json`;
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),3000);
    setMsg("エクスポートしました");setTimeout(()=>setMsg(""),2500);
  }
  function doImport(e){
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=()=>{
      try{
        const obj=JSON.parse(reader.result);
        const incoming=Array.isArray(obj)?obj:(obj.workout||[]);
        if(!Array.isArray(incoming))throw new Error("形式が不正です");
        const cur=loadWorkout();
        const ids=new Set(cur.map(r=>r.id));
        const added=incoming.filter(r=>r&&r.id!=null&&!ids.has(r.id));
        const merged=[...cur,...added].sort((a,b)=>new Date(a.date)-new Date(b.date));
        saveWorkout(merged);
        // 体組成データ(日付キーでマージ、既存日はスキップ)
        let bodyAdded=0;
        if(Array.isArray(obj.body)){
          const curBody=loadBody();
          const dates=new Set(curBody.map(e=>e.date));
          const newEntries=obj.body.filter(e=>e&&e.date&&typeof e.weight==="number"&&!dates.has(e.date));
          if(newEntries.length){saveBody([...curBody,...newEntries].sort((a,b)=>a.date<b.date?-1:1));bodyAdded=newEntries.length}
        }
        if(obj.bodyProfile&&obj.bodyProfile.height&&!loadBodyProfile().height)saveBodyProfile(obj.bodyProfile);
        onImported();
        setMsg(`インポート完了(筋トレ${added.length}件・体重${bodyAdded}件追加 / 重複はスキップ)`);
      }catch(err){setMsg("読み込み失敗: "+err.message)}
      setTimeout(()=>setMsg(""),4000);
      e.target.value="";
    };
    reader.readAsText(file);
  }
  return React.createElement("div",{className:"card backup-card"},
    React.createElement("div",{className:"card-header",style:{marginBottom:10}},
      React.createElement("span",{className:"card-icon backup-icon"},"⛁"),
      React.createElement("span",{className:"card-title"},"バックアップ")),
    React.createElement("p",{className:"backup-note"},"記録は端末のブラウザ内に保存されます。機種変更やデータ消去に備えて、定期的にエクスポートしてください。"),
    React.createElement("div",{className:"backup-btn-row"},
      React.createElement("button",{className:"backup-btn",onClick:doExport},"⤓ エクスポート"),
      React.createElement("button",{className:"backup-btn",onClick:()=>fileRef.current&&fileRef.current.click()},"⤒ インポート"),
      React.createElement("input",{ref:fileRef,type:"file",accept:".json,application/json",style:{display:"none"},onChange:doImport})),
    msg&&React.createElement("div",{className:"backup-msg"},msg));
}

// ─── 履歴編集フォーム(モーダル内) ───
function EditRecordForm({record,onSave,onCancel}){
  const [exercise,setExercise]=useState(record.exercise);
  const initRows=(record.sets||[{weight:record.weight,reps:record.reps}]).map(s=>({weight:String(s.weight),reps:String(s.reps)}));
  const [rows,setRows]=useState(initRows);
  function updateRow(i,next){setRows(prev=>prev.map((r,idx)=>idx===i?next:r))}
  function addRow(){const last=rows[rows.length-1]||{weight:"",reps:""};setRows(prev=>[...prev,{weight:last.weight,reps:last.reps}])}
  function removeRow(i){if(rows.length===1)return;setRows(prev=>prev.filter((_,idx)=>idx!==i))}
  function handleSave(){
    if(!exercise)return;
    const sets=buildSets(rows);
    if(sets.length===0)return;
    onSave({...record,exercise,sets,
      weight:Math.max(...sets.map(s=>s.weight)),
      total:sets.reduce((s,r)=>s+r.total,0)});
  }
  return React.createElement("div",{className:"edit-form"},
    React.createElement("div",{className:"field-group",style:{marginBottom:12}},
      React.createElement("label",{className:"field-label"},"種目"),
      React.createElement(ExerciseInput,{value:exercise,onChange:setExercise})),
    rows.map((row,i)=>React.createElement(SetRowEditor,{
      key:i,row,index:i,
      onChange:next=>updateRow(i,next),
      onRemove:()=>removeRow(i),
      canRemove:rows.length>1})),
    React.createElement("button",{className:"add-set-btn",onClick:addRow},"＋ セットを追加"),
    React.createElement("div",{className:"edit-btn-row"},
      React.createElement("button",{className:"edit-cancel-btn",onClick:onCancel},"キャンセル"),
      React.createElement("button",{className:"edit-save-btn",onClick:handleSave},"変更を保存")));
}

function DayModal({date,records,onDelete,onUpdate,onClose}){
  const [editingId,setEditingId]=useState(null);
  const totalVol=records.reduce((s,r)=>s+r.total,0);
  return React.createElement("div",{className:"modal-overlay",onClick:e=>{if(e.target.classList.contains("modal-overlay"))onClose()}},
    React.createElement("div",{className:"modal-sheet"},
      React.createElement("div",{className:"modal-handle"}),
      React.createElement("div",{className:"modal-head"},
        React.createElement("div",null,
          React.createElement("div",{className:"modal-date"},date),
          React.createElement("div",{className:"modal-vol"},"総ボリューム ",React.createElement("span",{className:"modal-vol-val"},totalVol.toFixed(0)),React.createElement("span",{className:"modal-vol-unit"}," kg"))),
        React.createElement("button",{className:"modal-close",onClick:onClose},"✕")),
      React.createElement("div",{className:"modal-body"},
        records.map(r=>{
          if(editingId===r.id){
            return React.createElement("div",{key:r.id,className:"history-card editing"},
              React.createElement(EditRecordForm,{record:r,
                onSave:(updated)=>{onUpdate(updated);setEditingId(null)},
                onCancel:()=>setEditingId(null)}));
          }
          const setsArr=r.sets||[{setNum:1,weight:r.weight,reps:r.reps,total:r.total}];
          return React.createElement("div",{key:r.id,className:"history-card"},
            React.createElement("div",{className:"hc-top"},
              React.createElement("span",{className:"hc-exercise"},r.exercise),
              React.createElement("span",{className:"hc-total-val"},r.total.toFixed(0)+" kg"),
              React.createElement("button",{className:"edit-btn",onClick:()=>setEditingId(r.id)},"✎"),
              React.createElement("button",{className:"del-btn",onClick:()=>{if(confirm("この記録を削除しますか？"))onDelete(r.id)}},"✕")),
            React.createElement("div",{className:"hc-sets"},
              setsArr.map(s=>React.createElement("div",{key:s.setNum,className:"hc-set-row"},
                React.createElement("span",{className:"hc-set-num"},"Set "+s.setNum),
                React.createElement("span",{className:"hc-set-detail"},s.weight+"kg × "+s.reps+"回"),
                React.createElement("span",{className:"hc-set-sub"},s.total.toFixed(0)+" kg")))));
        }))));
}

function History({data,onDelete,onUpdate}){
  const now=new Date();
  const [year,setYear]=useState(now.getFullYear());
  const [month,setMonth]=useState(now.getMonth());
  const [selected,setSelected]=useState(null);
  const byDate={};
  data.forEach(r=>{
    const d=new Date(r.date);
    const key=`${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,"0")}/${String(d.getDate()).padStart(2,"0")}`;
    if(!byDate[key])byDate[key]=[];
    byDate[key].push(r);
  });
  const firstDay=new Date(year,month,1).getDay();
  const daysInMonth=new Date(year,month+1,0).getDate();
  const today=new Date();
  const isToday=(d)=>d===today.getDate()&&month===today.getMonth()&&year===today.getFullYear();
  function prevMonth(){if(month===0){setYear(y=>y-1);setMonth(11)}else setMonth(m=>m-1)}
  function nextMonth(){if(month===11){setYear(y=>y+1);setMonth(0)}else setMonth(m=>m+1)}
  function getKey(d){return`${year}/${String(month+1).padStart(2,"0")}/${String(d).padStart(2,"0")}`}
  function getIntensity(d){
    const recs=byDate[getKey(d)];
    if(!recs)return 0;
    return recs.length>=3?3:recs.length>=2?2:1;
  }
  const monthNames=["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"];
  const dayNames=["日","月","火","水","木","金","土"];
  const cells=[];
  for(let i=0;i<firstDay;i++)cells.push(null);
  for(let d=1;d<=daysInMonth;d++)cells.push(d);
  if(!data.length)return React.createElement("div",{className:"card empty-card"},
    React.createElement("div",{className:"empty-icon"},"📅"),
    React.createElement("p",{className:"empty-text"},"まだ記録がありません"),
    React.createElement("p",{className:"empty-sub"},"記録タブからトレーニングを追加してみよう"));
  return React.createElement("div",{className:"history-wrap"},
    React.createElement("div",{className:"cal-header"},

      .total-label{font-size:.8rem;color:#777}
      .total-value{font-family:'Bebas Neue',sans-serif;font-size:1.6rem;color:#e8a020;letter-spacing:1px}
      .save-btn{width:100%;background:#e8a020;color:#0d0d14;border:none;border-radius:10px;padding:13px;font-size:.95rem;font-weight:700;font-family:inherit;cursor:pointer;letter-spacing:1px;transition:all .2s}
      .save-btn:hover{background:#f0b030}
      .save-btn.saved{background:#2a7a2a;color:#7fff7f}
      .save-btn.saved-pr{background:#7a5a10;color:#ffd870}
      /* backup */
      .backup-card{padding:16px 18px}
      .backup-icon{background:#2e2e48;color:#aaa}
      .backup-note{font-size:.72rem;color:#888;line-height:1.6;margin-bottom:12px}
      .backup-btn-row{display:flex;gap:8px}
      .backup-btn{flex:1;background:#1a1a30;border:1px solid #32324a;border-radius:8px;color:#bbb;padding:10px 0;font-size:.8rem;font-family:inherit;cursor:pointer;transition:all .2s}
      .backup-btn:hover{border-color:#e8a020;color:#e8a020}
      .backup-msg{margin-top:10px;font-size:.75rem;color:#60d080}
      /* history */
      .history-wrap{padding:0 16px}
      .history-card{background:#22223a;border:1px solid #2e2e48;border-radius:12px;padding:12px 14px;margin-bottom:8px}
      .history-card.editing{border-color:#e8a020}
      .hc-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
      .hc-exercise{font-size:.9rem;font-weight:700;color:#ddd;flex:1}
      .hc-total-val{font-family:'Bebas Neue',sans-serif;font-size:1.1rem;color:#e8a020}
      .edit-btn{background:none;border:1px solid #2e2e48;border-radius:6px;color:#888;cursor:pointer;font-size:.78rem;padding:3px 8px;transition:all .2s}
      .edit-btn:hover{border-color:#e8a020;color:#e8a020}
      .del-btn{background:none;border:none;color:#444;cursor:pointer;font-size:.75rem;padding:2px 4px;border-radius:4px;transition:color .2s}
      .del-btn:hover{color:#cc4444}
      .hc-sets{display:flex;flex-direction:column;gap:4px}
      .hc-set-row{display:flex;align-items:center;gap:10px}
      .hc-set-num{font-size:.65rem;color:#555;width:34px;flex-shrink:0}
      .hc-set-detail{font-size:.82rem;color:#aaa;flex:1}
      .hc-set-sub{font-size:.78rem;color:#666}
      /* edit form */
      .edit-form{padding-top:4px}
      .edit-btn-row{display:flex;gap:8px;margin-top:4px}
      .edit-cancel-btn{flex:1;background:#1a1a30;border:1px solid #32324a;border-radius:8px;color:#999;padding:11px 0;font-size:.85rem;font-family:inherit;cursor:pointer}
      .edit-save-btn{flex:2;background:#e8a020;border:none;border-radius:8px;color:#0d0d14;padding:11px 0;font-size:.85rem;font-weight:700;font-family:inherit;cursor:pointer}
      .edit-save-btn:hover{background:#f0b030}
      /* charts */
      .charts-wrap{padding:0 16px}
      .exercise-pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
      .pill{background:#22223a;border:1px solid #2e2e48;border-radius:20px;padding:6px 14px;font-size:.78rem;color:#777;cursor:pointer;font-family:inherit;transition:all .2s}
      .pill:hover{border-color:#e8a020;color:#ddd}
      .pill-active{background:#e8a02018;border-color:#e8a020;color:#e8a020}
      .pr-card{padding:16px 18px;margin-left:0;margin-right:0;background:linear-gradient(135deg,#2a2210,#22223a);border-color:#4a3a18}
      .pr-label{font-size:.68rem;color:#a08030;letter-spacing:1px;margin-bottom:4px}
      .pr-main{display:flex;align-items:baseline;gap:5px}
      .pr-value{font-family:'Bebas Neue',sans-serif;font-size:2.4rem;color:#f0c040;letter-spacing:1px;line-height:1}
      .pr-unit{font-size:.9rem;color:#a08030}
      .pr-detail{font-size:.78rem;color:#aaa;margin-top:6px}
      .pr-date{color:#666;font-size:.72rem}
      .chart-card{padding:16px 16px 8px;margin-left:0;margin-right:0}
      .chart-title{font-size:.8rem;color:#aaa;margin-bottom:12px;letter-spacing:.3px}
      .chart-unit{color:#777}
      .chart-note{font-size:.68rem;color:#666;line-height:1.6;padding:0 4px 20px}
      .empty-card{text-align:center;padding:40px 20px}
      .empty-icon{font-size:2.5rem;margin-bottom:12px;opacity:.4}
      .empty-text{font-size:.9rem;color:#888;margin-bottom:6px}
      .empty-sub{font-size:.75rem;color:#666}
      .bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#181830;border-top:1px solid #2e2e48;display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
      .nav-btn{flex:1;max-width:120px;background:none;border:none;color:#666;padding:12px 0;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:3px;transition:color .2s}
      .nav-btn.active{color:#e8a020}
      .nav-icon{font-size:1.2rem}
      .nav-label{font-size:.65rem;letter-spacing:.5px}
      ::-webkit-scrollbar{width:4px}
      ::-webkit-scrollbar-track{background:transparent}
      ::-webkit-scrollbar-thumb{background:#222;border-radius:2px}
      /* Body tab */
      .body-wrap{padding-bottom:8px}
      .body-summary{padding:18px 20px}
      .bs-main-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
      .bs-label{font-size:.68rem;color:#a08030;letter-spacing:1px;margin-bottom:4px}
      .bs-weight{font-family:'Bebas Neue',sans-serif;font-size:2.8rem;color:#f0c040;letter-spacing:1px;line-height:1}
      .bs-unit{font-size:1rem;color:#a08030;margin-left:4px}
      .bs-date{font-size:.68rem;color:#666;margin-top:4px}
      .bs-side{display:flex;flex-direction:column;gap:8px;padding-top:4px}
      .bs-side-item{display:flex;align-items:baseline;justify-content:flex-end;gap:8px}
      .bs-side-label{font-size:.62rem;color:#666;letter-spacing:.5px}
      .bs-side-val{font-family:'Bebas Neue',sans-serif;font-size:1.15rem;color:#ccc;letter-spacing:.5px}
      .delta-row{display:flex;gap:8px}
      .delta-chip{flex:1;background:#13132a;border:1px solid #2e2e48;border-radius:10px;padding:9px 12px;display:flex;flex-direction:column;gap:2px}
      .delta-label{font-size:.62rem;color:#666;letter-spacing:.5px}
      .delta-val{font-family:'Bebas Neue',sans-serif;font-size:1.15rem;letter-spacing:.5px}
      .delta-pct{font-size:.72rem;letter-spacing:0}
      .delta-up{color:#f0a050}
      .delta-down{color:#4fc3f7}
      .delta-flat{color:#999}
      .delta-none{color:#555;font-size:1rem}
      .body-form-row{display:flex;gap:10px}
      .body-note{font-size:.68rem;color:#666;margin-top:10px;line-height:1.6}
      .chart-head-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;flex-wrap:wrap}
      .chart-head-row .chart-title{margin-bottom:0}
      .period-tabs{display:flex;background:#181830;border-radius:8px;padding:2px}
      .period-tab{background:none;border:none;color:#666;padding:5px 10px;font-size:.68rem;font-family:inherit;cursor:pointer;border-radius:6px;transition:all .2s}
      .period-tab.active{background:#22223a;color:#e8a020;font-weight:700}
      .period-delta{font-size:.75rem;color:#888;margin-bottom:8px}
      .period-delta span{font-weight:700}
      .body-list-card{padding:16px 18px}
      .body-list-row{display:grid;grid-template-columns:44px 1fr 56px 62px 34px 24px;gap:6px;align-items:center;padding:8px 0;border-bottom:1px solid #26263e;font-size:.82rem}
      .body-list-row:last-child{border-bottom:none}
      .blr-date{color:#888;font-size:.75rem}
      .blr-weight{font-family:'Bebas Neue',sans-serif;font-size:1.05rem;color:#e8a020;letter-spacing:.5px}
      .blr-sub{color:#777;font-size:.72rem;text-align:right}
      /* Calendar */
      .cal-header{display:flex;align-items:center;justify-content:space-between;padding:0 16px 14px}
      .cal-month-label{font-family:'Bebas Neue',sans-serif;font-size:1.5rem;letter-spacing:2px;color:#eeeef8}
      .cal-nav-btn{background:none;border:1px solid #2e2e48;border-radius:8px;color:#aaa;width:36px;height:36px;font-size:1.3rem;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center}
      .cal-nav-btn:hover{border-color:#e8a020;color:#e8a020}
      .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:0 16px}
      .cal-dow{text-align:center;font-size:.62rem;color:#555;padding:4px 0;letter-spacing:.5px}
      .cal-cell{aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:default;transition:all .2s;position:relative;background:#1a1a2a}
      .cal-empty{background:transparent}
      .cal-day-num{font-size:.78rem;color:#666;line-height:1}
      .cal-has-rec{cursor:pointer;background:#22223a;border:1px solid #2e2e48}
      .cal-has-rec:hover{border-color:#e8a020;background:#252540}
      .cal-today .cal-day-num{color:#eeeef8;font-weight:700}
      .cal-today{border:1px solid #3a3a5a!important}
      .cal-selected{border-color:#e8a020!important;background:#2a2210!important}
      .cal-dot{width:6px;height:6px;border-radius:50%}
      .cal-dot-1{background:#c87820;opacity:.7}
      .cal-dot-2{background:#e8a020;opacity:.85}
      .cal-dot-3{background:#f0c040}
      .cal-legend{display:flex;align-items:center;gap:10px;padding:10px 16px 0;flex-wrap:wrap}
      .cal-legend-label{font-size:.65rem;color:#555;margin-right:2px}
      .cal-legend-item{display:flex;align-items:center;gap:4px;font-size:.65rem;color:#666}
      /* Modal */
      .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:200;display:flex;align-items:flex-end;animation:fadeIn .2s ease}
      @keyframes fadeIn{from{opacity:0}to{opacity:1}}
      .modal-sheet{width:100%;max-width:480px;margin:0 auto;background:#1e1e32;border-radius:20px 20px 0 0;border-top:1px solid #2e2e48;max-height:82vh;display:flex;flex-direction:column;animation:slideUp .25s cubic-bezier(.32,1,.5,1)}
      @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
      .modal-handle{width:36px;height:4px;background:#333;border-radius:2px;margin:12px auto 0}
      .modal-head{display:flex;align-items:flex-start;justify-content:space-between;padding:16px 20px 12px;border-bottom:1px solid #2e2e48;flex-shrink:0}
      .modal-date{font-family:'Bebas Neue',sans-serif;font-size:1.3rem;letter-spacing:2px;color:#ddd}
      .modal-vol{font-size:.72rem;color:#888;margin-top:2px;display:flex;align-items:center;flex-wrap:wrap;gap:4px}
      .modal-vol-val{font-family:'Bebas Neue',sans-serif;font-size:1rem;color:#e8a020;letter-spacing:1px}
      .modal-vol-unit{color:#666}
      .modal-close{background:none;border:1px solid #2e2e48;border-radius:8px;color:#888;width:32px;height:32px;font-size:.85rem;cursor:pointer;flex-shrink:0;transition:all .2s}
      .modal-close:hover{border-color:#cc4444;color:#cc4444}
      .modal-body{overflow-y:auto;padding:14px 16px 28px;display:flex;flex-direction:column;gap:0}
    `),
    React.createElement("div",{className:"app"},
      React.createElement("div",{className:"header"},
        React.createElement("span",{className:"header-logo"},"IRON LOG"),
        React.createElement("span",{className:"header-sub"},tab==="body"?"体重管理":"筋トレ記録"),
        React.createElement("span",{className:"header-count"},
          tab==="body"?bodyData.length+" days":workoutData.length+" records")),

      tab==="record"&&React.createElement(React.Fragment,null,
        React.createElement(RecordForm,{onSave:refreshWorkout}),
        React.createElement(BackupCard,{onImported:refreshAll})),
      tab==="history"&&React.createElement(History,{data:workoutData,onDelete:handleDeleteWorkout,onUpdate:handleUpdateWorkout}),
      tab==="chart"&&React.createElement(Charts,{data:workoutData}),
      tab==="body"&&React.createElement(BodyTab,{entries:bodyData,onChange:setBodyData})
    ),

    React.createElement("nav",{className:"bottom-nav"},
      mainTabs.map(t=>React.createElement("button",{
        key:t.id,
        className:"nav-btn"+(tab===t.id?" active":""),
        onClick:()=>setTab(t.id)
      },
        React.createElement("span",{className:"nav-icon"},t.icon),
        React.createElement("span",{className:"nav-label"},t.label))))
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
  </script>
</body>
</html>
