  <script>
const { useState, useEffect, useRef, useMemo } = React;
const { LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer } = Recharts;

// ─── Workout data ───
const PRESET_EXERCISES = [
  "ベンチプレス","インクラインベンチプレス","ダンベルフライ","ケーブルクロスオーバー",
  "スクワット","レッグプレス","レッグカール","レッグエクステンション","ブルガリアンスクワット",
  "デッドリフト","ルーマニアンデッドリフト","懸垂","ラットプルダウン","シーテッドロウ",
  "ショルダープレス","サイドレイズ","フロントレイズ","フェイスプル",
  "バーベルカール","ハンマーカール","トライセプスプレスダウン","スカルクラッシャー",
  "プランク","クランチ","レッグレイズ","ヒップスラスト","カーフレイズ"
];

const STORAGE_KEY_WORKOUT = "workout_log_v2";
const STORAGE_KEY_MEAL    = "meal_log_v1"; // 旧・食事データ(バックアップ対象として保持)

function loadWorkout(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY_WORKOUT)||"[]")}catch{return[]}}
function saveWorkout(d){localStorage.setItem(STORAGE_KEY_WORKOUT,JSON.stringify(d))}
function loadMeals(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY_MEAL)||"[]")}catch{return[]}}

function formatDate(iso){const d=new Date(iso);return`${d.getMonth()+1}/${d.getDate()}`}
function formatDateFull(iso){const d=new Date(iso);return`${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,"0")}/${String(d.getDate()).padStart(2,"0")}`}

// ─── e1RM (Epley式: w × (1 + reps/30)) ───
function e1rm(weight,reps){
  if(!(weight>0&&reps>0))return 0;
  if(reps===1)return weight;
  return weight*(1+reps/30);
}
function recordBestE1rm(rec){
  const sets=rec.sets||[{weight:rec.weight,reps:rec.reps}];
  let best=0,bestSet=null;
  sets.forEach(s=>{const v=e1rm(s.weight,s.reps);if(v>best){best=v;bestSet=s}});
  return {value:best,set:bestSet};
}
// 指定種目の過去ベスト(excludeId を除く)
function bestE1rmFor(data,exercise,excludeId){
  let best=0,bestRec=null,bestSet=null;
  data.forEach(r=>{
    if(r.exercise!==exercise)return;
    if(excludeId!=null&&r.id===excludeId)return;
    const b=recordBestE1rm(r);
    if(b.value>best){best=b.value;bestRec=r;bestSet=b.set}
  });
  return {value:best,record:bestRec,set:bestSet};
}

function ExerciseInput({value,onChange}){
  const usedExercises=[...new Set(loadWorkout().map(r=>r.exercise))];
  const pool=[...new Set([...usedExercises,...PRESET_EXERCISES])];
  const [open,setOpen]=useState(false);
  const ref=useRef(null);
  const suggestions=value.length===0?pool.slice(0,8):pool.filter(e=>e.includes(value)).slice(0,8);
  useEffect(()=>{
    const h=e=>{if(ref.current&&!ref.current.contains(e.target))setOpen(false)};
    document.addEventListener("mousedown",h);return()=>document.removeEventListener("mousedown",h);
  },[]);
  return React.createElement("div",{ref,style:{position:"relative"}},
    React.createElement("input",{className:"field-input",placeholder:"例：ベンチプレス",value,
      onChange:e=>{onChange(e.target.value);setOpen(true)},onFocus:()=>setOpen(true),autoComplete:"off"}),
    open&&suggestions.length>0&&React.createElement("ul",{className:"suggest-list"},
      suggestions.map(s=>React.createElement("li",{key:s,className:"suggest-item",
        onMouseDown:()=>{onChange(s);setOpen(false)}},
        usedExercises.includes(s)
          ?[React.createElement("span",{key:"b",className:"suggest-badge"},"履歴"),s]
          :s)))
  );
}

// ─── セット入力行(±ボタン付き・記録と編集で共用) ───
function stepWeight(cur,delta){
  const w=parseFloat(cur);
  const base=isNaN(w)?0:w;
  const next=Math.max(0,base+delta);
  return next===0?"":String(Math.round(next*100)/100);
}
function SetRowEditor({row,index,onChange,onRemove,canRemove}){
  const sub=(parseFloat(row.weight)>0&&parseInt(row.reps)>0)?(parseFloat(row.weight)*parseInt(row.reps)).toFixed(0):"—";
  return React.createElement("div",{className:"set-row2"},
    React.createElement("span",{className:"set-num"},index+1),
    React.createElement("div",{className:"set-row2-main"},
      React.createElement("div",{className:"stepper-row"},
        React.createElement("button",{className:"step-btn",onClick:()=>onChange({...row,weight:stepWeight(row.weight,-10)})},"−10"),
        React.createElement("button",{className:"step-btn",onClick:()=>onChange({...row,weight:stepWeight(row.weight,-5)})},"−5"),
        React.createElement("input",{className:"field-input weight-input",type:"number",inputMode:"decimal",min:"0",step:"0.5",placeholder:"60",value:row.weight,
          onChange:e=>onChange({...row,weight:e.target.value})}),
        React.createElement("span",{className:"step-unit"},"kg"),
        React.createElement("button",{className:"step-btn step-plus",onClick:()=>onChange({...row,weight:stepWeight(row.weight,5)})},"+5"),
        React.createElement("button",{className:"step-btn step-plus",onClick:()=>onChange({...row,weight:stepWeight(row.weight,10)})},"+10")),
      React.createElement("div",{className:"reps-sub-row"},
        React.createElement("input",{className:"field-input reps-input",type:"number",inputMode:"numeric",min:"1",placeholder:"10",value:row.reps,
          onChange:e=>onChange({...row,reps:e.target.value})}),
        React.createElement("span",{className:"step-unit"},"回"),
        React.createElement("span",{className:"set-subtotal"},"小計 "+sub+" kg"))),
    React.createElement("button",{className:"set-del-btn",onClick:onRemove,disabled:!canRemove},"✕"));
}

// レコード保存用: rows → record.sets 等を組み立て
function buildSets(rows){
  const validSets=rows.filter(r=>parseFloat(r.weight)>0&&parseInt(r.reps)>0);
  return validSets.map((r,i)=>({setNum:i+1,weight:parseFloat(r.weight),reps:parseInt(r.reps),total:parseFloat(r.weight)*parseInt(r.reps)}));
}

function RecordForm({onSave}){
  const [exercise,setExercise]=useState("");
  const [rows,setRows]=useState([{weight:"",reps:""}]);
  const [savedMsg,setSavedMsg]=useState(null); // null | {pr:boolean, text}
  function updateRow(i,next){setRows(prev=>prev.map((r,idx)=>idx===i?next:r))}
  function addRow(){const last=rows[rows.length-1];setRows(prev=>[...prev,{weight:last.weight,reps:last.reps}])}
  function removeRow(i){if(rows.length===1)return;setRows(prev=>prev.filter((_,idx)=>idx!==i))}
  const grandTotal=rows.reduce((sum,r)=>{const w=parseFloat(r.weight),rp=parseInt(r.reps);return(w>0&&rp>0)?sum+w*rp:sum},0);
  function handleSave(){
    if(!exercise)return;
    const sets=buildSets(rows);
    if(sets.length===0)return;
    const record={
      id:Date.now(),date:new Date().toISOString(),exercise,sets,
      weight:Math.max(...sets.map(s=>s.weight)),
      total:sets.reduce((s,r)=>s+r.total,0)
    };
    const all=loadWorkout();
    // PR判定(保存前の過去ベストと比較)
    const prevBest=bestE1rmFor(all,exercise,null).value;
    const thisBest=recordBestE1rm(record).value;
    const isPR=prevBest>0&&thisBest>prevBest;
    all.push(record);saveWorkout(all);onSave();
    setSavedMsg(isPR?{pr:true,text:`🎉 e1RM更新！ ${thisBest.toFixed(1)}kg (前回 ${prevBest.toFixed(1)}kg)`}:{pr:false,text:"✓ 保存完了！"});
    setExercise("");setRows([{weight:"",reps:""}]);
    setTimeout(()=>setSavedMsg(null),isPR?3500:1800);
  }
  return React.createElement("div",{className:"card"},
    React.createElement("div",{className:"card-header"},
      React.createElement("span",{className:"card-icon"},"✚"),
      React.createElement("span",{className:"card-title"},"トレーニング記録")),
    React.createElement("div",{className:"field-group",style:{marginBottom:16}},
      React.createElement("label",{className:"field-label"},"種目"),
      React.createElement(ExerciseInput,{value:exercise,onChange:setExercise})),
    rows.map((row,i)=>React.createElement(SetRowEditor,{
      key:i,row,index:i,
      onChange:next=>updateRow(i,next),
      onRemove:()=>removeRow(i),
      canRemove:rows.length>1})),
    React.createElement("button",{className:"add-set-btn",onClick:addRow},"＋ セットを追加"),
    React.createElement("div",{className:"total-bar"},
      React.createElement("span",{className:"total-label"},"総重量合計"),
      React.createElement("span",{className:"total-value"},
        grandTotal>0?grandTotal.toFixed(0):"—",
        React.createElement("span",{className:"unit"}," kg"))),
    React.createElement("button",{className:"save-btn"+(savedMsg?(savedMsg.pr?" saved-pr":" saved"):""),onClick:handleSave},
      savedMsg?savedMsg.text:"保存する")
  );
}

// ─── バックアップ(エクスポート/インポート) ───
function BackupCard({onImported}){
  const fileRef=useRef(null);
  const [msg,setMsg]=useState("");
  function doExport(){
    const payload={app:"iron-log",version:1,exportedAt:new Date().toISOString(),
      workout:loadWorkout(),meal:loadMeals()};
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    const d=new Date(),ds=`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}`;
    a.href=url;a.download=`iron-log-backup-${ds}.json`;
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),3000);
    setMsg("エクスポートしました");setTimeout(()=>setMsg(""),2500);
  }
  function doImport(e){
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=()=>{
      try{
        const obj=JSON.parse(reader.result);
        const incoming=Array.isArray(obj)?obj:(obj.workout||[]);
        if(!Array.isArray(incoming))throw new Error("形式が不正です");
        const cur=loadWorkout();
        const ids=new Set(cur.map(r=>r.id));
        const added=incoming.filter(r=>r&&r.id!=null&&!ids.has(r.id));
        const merged=[...cur,...added].sort((a,b)=>new Date(a.date)-new Date(b.date));
        saveWorkout(merged);onImported();
        setMsg(`インポート完了(${added.length}件追加 / 重複${incoming.length-added.length}件スキップ)`);
      }catch(err){setMsg("読み込み失敗: "+err.message)}
      setTimeout(()=>setMsg(""),4000);
      e.target.value="";
    };
    reader.readAsText(file);
  }
  return React.createElement("div",{className:"card backup-card"},
    React.createElement("div",{className:"card-header",style:{marginBottom:10}},
      React.createElement("span",{className:"card-icon backup-icon"},"⛁"),
      React.createElement("span",{className:"card-title"},"バックアップ")),
    React.createElement("p",{className:"backup-note"},"記録は端末のブラウザ内に保存されます。機種変更やデータ消去に備えて、定期的にエクスポートしてください。"),
    React.createElement("div",{className:"backup-btn-row"},
      React.createElement("button",{className:"backup-btn",onClick:doExport},"⤓ エクスポート"),
      React.createElement("button",{className:"backup-btn",onClick:()=>fileRef.current&&fileRef.current.click()},"⤒ インポート"),
      React.createElement("input",{ref:fileRef,type:"file",accept:".json,application/json",style:{display:"none"},onChange:doImport})),
    msg&&React.createElement("div",{className:"backup-msg"},msg));
}

// ─── 履歴編集フォーム(モーダル内) ───
function EditRecordForm({record,onSave,onCancel}){
  const [exercise,setExercise]=useState(record.exercise);
  const initRows=(record.sets||[{weight:record.weight,reps:record.reps}]).map(s=>({weight:String(s.weight),reps:String(s.reps)}));
  const [rows,setRows]=useState(initRows);
  function updateRow(i,next){setRows(prev=>prev.map((r,idx)=>idx===i?next:r))}
  function addRow(){const last=rows[rows.length-1]||{weight:"",reps:""};setRows(prev=>[...prev,{weight:last.weight,reps:last.reps}])}
  function removeRow(i){if(rows.length===1)return;setRows(prev=>prev.filter((_,idx)=>idx!==i))}
  function handleSave(){
    if(!exercise)return;
    const sets=buildSets(rows);
    if(sets.length===0)return;
    onSave({...record,exercise,sets,
      weight:Math.max(...sets.map(s=>s.weight)),
      total:sets.reduce((s,r)=>s+r.total,0)});
  }
  return React.createElement("div",{className:"edit-form"},
    React.createElement("div",{className:"field-group",style:{marginBottom:12}},
      React.createElement("label",{className:"field-label"},"種目"),
      React.createElement(ExerciseInput,{value:exercise,onChange:setExercise})),
    rows.map((row,i)=>React.createElement(SetRowEditor,{
      key:i,row,index:i,
      onChange:next=>updateRow(i,next),
      onRemove:()=>removeRow(i),
      canRemove:rows.length>1})),
    React.createElement("button",{className:"add-set-btn",onClick:addRow},"＋ セットを追加"),
    React.createElement("div",{className:"edit-btn-row"},
      React.createElement("button",{className:"edit-cancel-btn",onClick:onCancel},"キャンセル"),
      React.createElement("button",{className:"edit-save-btn",onClick:handleSave},"変更を保存")));
}

function DayModal({date,records,onDelete,onUpdate,onClose}){
  const [editingId,setEditingId]=useState(null);
  const totalVol=records.reduce((s,r)=>s+r.total,0);
  return React.createElement("div",{className:"modal-overlay",onClick:e=>{if(e.target.classList.contains("modal-overlay"))onClose()}},
    React.createElement("div",{className:"modal-sheet"},
      React.createElement("div",{className:"modal-handle"}),
      React.createElement("div",{className:"modal-head"},
        React.createElement("div",null,
          React.createElement("div",{className:"modal-date"},date),
          React.createElement("div",{className:"modal-vol"},"総ボリューム ",React.createElement("span",{className:"modal-vol-val"},totalVol.toFixed(0)),React.createElement("span",{className:"modal-vol-unit"}," kg"))),
        React.createElement("button",{className:"modal-close",onClick:onClose},"✕")),
      React.createElement("div",{className:"modal-body"},
        records.map(r=>{
          if(editingId===r.id){
            return React.createElement("div",{key:r.id,className:"history-card editing"},
              React.createElement(EditRecordForm,{record:r,
                onSave:(updated)=>{onUpdate(updated);setEditingId(null)},
                onCancel:()=>setEditingId(null)}));
          }
          const setsArr=r.sets||[{setNum:1,weight:r.weight,reps:r.reps,total:r.total}];
          return React.createElement("div",{key:r.id,className:"history-card"},
            React.createElement("div",{className:"hc-top"},
              React.createElement("span",{className:"hc-exercise"},r.exercise),
              React.createElement("span",{className:"hc-total-val"},r.total.toFixed(0)+" kg"),
              React.createElement("button",{className:"edit-btn",onClick:()=>setEditingId(r.id)},"✎"),
              React.createElement("button",{className:"del-btn",onClick:()=>{if(confirm("この記録を削除しますか？"))onDelete(r.id)}},"✕")),
            React.createElement("div",{className:"hc-sets"},
              setsArr.map(s=>React.createElement("div",{key:s.setNum,className:"hc-set-row"},
                React.createElement("span",{className:"hc-set-num"},"Set "+s.setNum),
                React.createElement("span",{className:"hc-set-detail"},s.weight+"kg × "+s.reps+"回"),
                React.createElement("span",{className:"hc-set-sub"},s.total.toFixed(0)+" kg")))));
        }))));
}

function History({data,onDelete,onUpdate}){
  const now=new Date();
  const [year,setYear]=useState(now.getFullYear());
  const [month,setMonth]=useState(now.getMonth());
  const [selected,setSelected]=useState(null);
  const byDate={};
  data.forEach(r=>{
    const d=new Date(r.date);
    const key=`${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,"0")}/${String(d.getDate()).padStart(2,"0")}`;
    if(!byDate[key])byDate[key]=[];
    byDate[key].push(r);
  });
  const firstDay=new Date(year,month,1).getDay();
  const daysInMonth=new Date(year,month+1,0).getDate();
  const today=new Date();
  const isToday=(d)=>d===today.getDate()&&month===today.getMonth()&&year===today.getFullYear();
  function prevMonth(){if(month===0){setYear(y=>y-1);setMonth(11)}else setMonth(m=>m-1)}
  function nextMonth(){if(month===11){setYear(y=>y+1);setMonth(0)}else setMonth(m=>m+1)}
  function getKey(d){return`${year}/${String(month+1).padStart(2,"0")}/${String(d).padStart(2,"0")}`}
  function getIntensity(d){
    const recs=byDate[getKey(d)];
    if(!recs)return 0;
    return recs.length>=3?3:recs.length>=2?2:1;
  }
  const monthNames=["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"];
  const dayNames=["日","月","火","水","木","金","土"];
  const cells=[];
  for(let i=0;i<firstDay;i++)cells.push(null);
  for(let d=1;d<=daysInMonth;d++)cells.push(d);
  if(!data.length)return React.createElement("div",{className:"card empty-card"},
    React.createElement("div",{className:"empty-icon"},"📅"),
    React.createElement("p",{className:"empty-text"},"まだ記録がありません"),
    React.createElement("p",{className:"empty-sub"},"記録タブからトレーニングを追加してみよう"));
  return React.createElement("div",{className:"history-wrap"},
    React.createElement("div",{className:"cal-header"},
      React.createElement("button",{className:"cal-nav-btn",onClick:prevMonth},"‹"),
      React.createElement("span",{className:"cal-month-label"},`${year}年 ${monthNames[month]}`),
      React.createElement("button",{className:"cal-nav-btn",onClick:nextMonth},"›")),
    React.createElement("div",{className:"cal-grid"},
      dayNames.map(d=>React.createElement("div",{key:d,className:"cal-dow"},d)),
      cells.map((d,i)=>{
        if(d===null)return React.createElement("div",{key:`e${i}`,className:"cal-cell cal-empty"});
        const intensity=getIntensity(d);
        const key=getKey(d);
        const active=selected===key;
        return React.createElement("div",{
          key:d,className:`cal-cell${intensity>0?" cal-has-rec":""}${isToday(d)?" cal-today":""}${active?" cal-selected":""}`,
          "data-intensity":intensity,onClick:()=>{if(intensity>0)setSelected(key)}},
          React.createElement("span",{className:"cal-day-num"},d),
          intensity>0&&React.createElement("div",{className:`cal-dot cal-dot-${intensity}`}));
      })),
    React.createElement("div",{className:"cal-legend"},
      React.createElement("span",{className:"cal-legend-label"},"記録数:"),
      [1,2,3].map(i=>React.createElement("div",{key:i,className:"cal-legend-item"},
        React.createElement("div",{className:`cal-dot cal-dot-${i}`}),
        React.createElement("span",null,i===1?"1件":i===2?"2件":"3件+")))),
    selected&&byDate[selected]&&React.createElement(DayModal,{
      date:selected,records:byDate[selected],
      onDelete:(id)=>{onDelete(id);if(!byDate[selected]||byDate[selected].length<=1)setSelected(null)},
      onUpdate,
      onClose:()=>setSelected(null)
    })
  );
}

// ─── e1RMグラフ ───
function Charts({data}){
  const exercises=[...new Set(data.map(r=>r.exercise))];
  const [selected,setSelected]=useState(exercises[0]||"");
  useEffect(()=>{if(!selected&&exercises.length>0)setSelected(exercises[0])},[exercises.length]);
  if(!data.length)return React.createElement("div",{className:"card empty-card"},
    React.createElement("div",{className:"empty-icon"},"📈"),
    React.createElement("p",{className:"empty-text"},"データがありません"),
    React.createElement("p",{className:"empty-sub"},"記録が増えるとグラフが表示されます"));

  const recs=data.filter(r=>r.exercise===selected)
    .sort((a,b)=>new Date(a.date)-new Date(b.date));

  // 同じ日はその日のベストe1RMに集約
  const byDay=new Map();
  recs.forEach(r=>{
    const key=formatDateFull(r.date);
    const b=recordBestE1rm(r);
    const cur=byDay.get(key);
    if(!cur||b.value>cur.e1rm)byDay.set(key,{date:formatDate(r.date),e1rm:b.value,set:b.set});
  });
  const chartData=[...byDay.entries()].map(([full,v])=>({date:v.date,"推定1RM":Math.round(v.e1rm*10)/10}));

  // 自己ベスト
  const best=bestE1rmFor(data.filter(r=>r.exercise===selected),selected,null);
  const bestDateStr=best.record?formatDateFull(best.record.date):"";

  const tooltipStyle={contentStyle:{background:"#252540",border:"1px solid #333",borderRadius:8},labelStyle:{color:"#ccc"}};
  const gridStyle={strokeDasharray:"3 3",stroke:"rgba(255,255,255,0.07)"};
  const tickStyle={fontSize:11,fill:"#888"};
