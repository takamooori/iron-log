<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="IRON LOG" />
  <meta name="theme-color" content="#0d0d14" />
  <title>IRON LOG</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0d0d14; color: #e8e8f0; font-family: 'Noto Sans JP', sans-serif; min-height: 100vh; }
    #root { max-width: 480px; margin: 0 auto; }
    #loading { display:flex; align-items:center; justify-content:center; height:100vh; color:#e8a020; font-family:'Bebas Neue',sans-serif; font-size:2rem; letter-spacing:4px; }
  </style>
</head>
<body>
  <div id="root"><div id="loading">IRON LOG</div></div>

  <!-- React 18 -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Recharts (依存: prop-types) -->
  <script crossorigin src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>
  <script crossorigin src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>

  <script>
const { useState, useEffect, useRef } = React;
const { LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer } = Recharts;

const PRESET_EXERCISES = [
  "ベンチプレス","インクラインベンチプレス","ダンベルフライ","ケーブルクロスオーバー",
  "スクワット","レッグプレス","レッグカール","レッグエクステンション","ブルガリアンスクワット",
  "デッドリフト","ルーマニアンデッドリフト","懸垂","ラットプルダウン","シーテッドロウ",
  "ショルダープレス","サイドレイズ","フロントレイズ","フェイスプル",
  "バーベルカール","ハンマーカール","トライセプスプレスダウン","スカルクラッシャー",
  "プランク","クランチ","レッグレイズ","ヒップスラスト","カーフレイズ"
];
const STORAGE_KEY = "workout_log_v2";
function loadData(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]")}catch{return[]}}
function saveData(d){localStorage.setItem(STORAGE_KEY,JSON.stringify(d))}
function formatDate(iso){const d=new Date(iso);return`${d.getMonth()+1}/${d.getDate()}`}
function formatDateFull(iso){const d=new Date(iso);return`${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,"0")}/${String(d.getDate()).padStart(2,"0")}`}

function ExerciseInput({value,onChange}){
  const [open,setOpen]=useState(false);
  const ref=useRef(null);
  const usedExercises=[...new Set(loadData().map(r=>r.exercise))];
  const pool=[...new Set([...usedExercises,...PRESET_EXERCISES])];
  const suggestions=value.length===0?pool.slice(0,8):pool.filter(e=>e.includes(value)).slice(0,8);
  useEffect(()=>{
    const h=e=>{if(ref.current&&!ref.current.contains(e.target))setOpen(false)};
    document.addEventListener("mousedown",h);return()=>document.removeEventListener("mousedown",h);
  },[]);
  return React.createElement("div",{ref,style:{position:"relative"}},
    React.createElement("input",{className:"field-input",placeholder:"例：ベンチプレス",value,
      onChange:e=>{onChange(e.target.value);setOpen(true)},onFocus:()=>setOpen(true),autoComplete:"off"}),
    open&&suggestions.length>0&&React.createElement("ul",{className:"suggest-list"},
      suggestions.map(s=>React.createElement("li",{key:s,className:"suggest-item",
        onMouseDown:()=>{onChange(s);setOpen(false)}},
        usedExercises.includes(s)
          ?[React.createElement("span",{key:"b",className:"suggest-badge"},"履歴"),s]
          :s)))
  );
}

function RecordForm({onSave}){
  const [exercise,setExercise]=useState("");
  const [rows,setRows]=useState([{weight:"",reps:""}]);
  const [saved,setSaved]=useState(false);
  function updateRow(i,field,val){setRows(prev=>prev.map((r,idx)=>idx===i?{...r,[field]:val}:r))}
  function addRow(){const last=rows[rows.length-1];setRows(prev=>[...prev,{weight:last.weight,reps:last.reps}])}
  function removeRow(i){if(rows.length===1)return;setRows(prev=>prev.filter((_,idx)=>idx!==i))}
  const grandTotal=rows.reduce((sum,r)=>{const w=parseFloat(r.weight),rp=parseInt(r.reps);return(w>0&&rp>0)?sum+w*rp:sum},0);
  function handleSave(){
    if(!exercise)return;
    const validSets=rows.filter(r=>parseFloat(r.weight)>0&&parseInt(r.reps)>0);
    if(validSets.length===0)return;
    const record={
      id:Date.now(),date:new Date().toISOString(),exercise,
      sets:validSets.map((r,i)=>({setNum:i+1,weight:parseFloat(r.weight),reps:parseInt(r.reps),total:parseFloat(r.weight)*parseInt(r.reps)})),
      weight:Math.max(...validSets.map(r=>parseFloat(r.weight))),
      total:validSets.reduce((s,r)=>s+parseFloat(r.weight)*parseInt(r.reps),0)
    };
    const all=loadData();all.push(record);saveData(all);onSave();
    setSaved(true);setExercise("");setRows([{weight:"",reps:""}]);
    setTimeout(()=>setSaved(false),1800);
  }
  return React.createElement("div",{className:"card"},
    React.createElement("div",{className:"card-header"},
      React.createElement("span",{className:"card-icon"},"✚"),
      React.createElement("span",{className:"card-title"},"トレーニング記録")),
    React.createElement("div",{className:"field-group",style:{marginBottom:16}},
      React.createElement("label",{className:"field-label"},"種目"),
      React.createElement(ExerciseInput,{value:exercise,onChange:setExercise})),
    React.createElement("div",{className:"set-header-row"},
      React.createElement("span",null),
      React.createElement("span",{className:"set-col-label"},"重量 kg"),
      React.createElement("span",{className:"set-col-label"},"レップス 回"),
      React.createElement("span",{className:"set-col-label set-subtotal-label"},"小計 kg"),
      React.createElement("span",{style:{width:28}})),
    rows.map((row,i)=>{
      const sub=(parseFloat(row.weight)>0&&parseInt(row.reps)>0)?(parseFloat(row.weight)*parseInt(row.reps)).toFixed(0):"—";
      return React.createElement("div",{key:i,className:"set-row"},
        React.createElement("span",{className:"set-num"},i+1),
        React.createElement("input",{className:"field-input set-input",type:"number",min:"0",step:"0.5",placeholder:"60",value:row.weight,onChange:e=>updateRow(i,"weight",e.target.value)}),
        React.createElement("input",{className:"field-input set-input",type:"number",min:"1",placeholder:"10",value:row.reps,onChange:e=>updateRow(i,"reps",e.target.value)}),
        React.createElement("span",{className:"set-subtotal"},sub),
        React.createElement("button",{className:"set-del-btn",onClick:()=>removeRow(i)},"✕"));
    }),
    React.createElement("button",{className:"add-set-btn",onClick:addRow},"＋ セットを追加"),
    React.createElement("div",{className:"total-bar"},
      React.createElement("span",{className:"total-label"},"総重量合計"),
      React.createElement("span",{className:"total-value"},
        grandTotal>0?grandTotal.toFixed(0):"—",
        React.createElement("span",{className:"unit"}," kg"))),
    React.createElement("button",{className:"save-btn"+(saved?" saved":""),onClick:handleSave},
      saved?"✓ 保存完了！":"保存する")
  );
}

function History({data,onDelete}){
  const byDate={};
  [...data].reverse().forEach(r=>{const d=formatDateFull(r.date);if(!byDate[d])byDate[d]=[];byDate[d].push(r)});
  if(data.length===0)return React.createElement("div",{className:"card empty-card"},
    React.createElement("div",{className:"empty-icon"},"📋"),
    React.createElement("p",{className:"empty-text"},"まだ記録がありません"),
    React.createElement("p",{className:"empty-sub"},"記録タブからトレーニングを追加してみよう"));
  return React.createElement("div",{className:"history-wrap"},
    Object.entries(byDate).map(([date,records])=>
      React.createElement("div",{key:date,className:"day-group"},
        React.createElement("div",{className:"day-label"},date),
        records.map(r=>{
          const setsArr=r.sets||[{setNum:1,weight:r.weight,reps:r.reps,total:r.total}];
          return React.createElement("div",{key:r.id,className:"history-card"},
            React.createElement("div",{className:"hc-top"},
              React.createElement("span",{className:"hc-exercise"},r.exercise),
              React.createElement("span",{className:"hc-total-val"},r.total.toFixed(0)+" kg"),
              React.createElement("button",{className:"del-btn",onClick:()=>onDelete(r.id)},"✕")),
            React.createElement("div",{className:"hc-sets"},
              setsArr.map(s=>React.createElement("div",{key:s.setNum,className:"hc-set-row"},
                React.createElement("span",{className:"hc-set-num"},"Set "+s.setNum),
                React.createElement("span",{className:"hc-set-detail"},s.weight+"kg × "+s.reps+"回"),
                React.createElement("span",{className:"hc-set-sub"},s.total.toFixed(0)+" kg")))));
        }))));
}

function Charts({data}){
  const exercises=[...new Set(data.map(r=>r.exercise))];
  const [selected,setSelected]=useState(exercises[0]||"");
  useEffect(()=>{if(!selected&&exercises.length>0)setSelected(exercises[0])},[exercises.length]);
  if(data.length===0)return React.createElement("div",{className:"card empty-card"},
    React.createElement("div",{className:"empty-icon"},"📈"),
    React.createElement("p",{className:"empty-text"},"データがありません"),
    React.createElement("p",{className:"empty-sub"},"記録が増えるとグラフが表示されます"));
  const chartData=data.filter(r=>r.exercise===selected)
    .sort((a,b)=>new Date(a.date)-new Date(b.date))
    .map(r=>({date:formatDate(r.date),総重量:r.total,最大重量:r.weight}));
  const tooltipStyle={contentStyle:{background:"#1a1a2e",border:"1px solid #333",borderRadius:8},labelStyle:{color:"#ccc"}};
  const gridStyle={strokeDasharray:"3 3",stroke:"rgba(255,255,255,0.07)"};
  const tickStyle={fontSize:11,fill:"#888"};
  return React.createElement("div",{className:"charts-wrap"},
    React.createElement("div",{className:"exercise-pills"},
      exercises.map(e=>React.createElement("button",{key:e,className:"pill"+(e===selected?" pill-active":""),onClick:()=>setSelected(e)},e))),
    React.createElement("div",{className:"card chart-card"},
      React.createElement("div",{className:"chart-title"},"総重量の推移 ",React.createElement("span",{className:"chart-unit"},"(kg)")),
      React.createElement(ResponsiveContainer,{width:"100%",height:200},
        React.createElement(LineChart,{data:chartData,margin:{top:5,right:16,left:-10,bottom:0}},
          React.createElement(CartesianGrid,gridStyle),
          React.createElement(XAxis,{dataKey:"date",tick:tickStyle}),
          React.createElement(YAxis,{tick:tickStyle}),
          React.createElement(Tooltip,tooltipStyle),
          React.createElement(Line,{type:"monotone",dataKey:"総重量",stroke:"#e8a020",strokeWidth:2.5,dot:{r:4,fill:"#e8a020"},activeDot:{r:6}})))),
    React.createElement("div",{className:"card chart-card"},
      React.createElement("div",{className:"chart-title"},"最大重量の推移 ",React.createElement("span",{className:"chart-unit"},"(kg)")),
      React.createElement(ResponsiveContainer,{width:"100%",height:200},
        React.createElement(LineChart,{data:chartData,margin:{top:5,right:16,left:-10,bottom:0}},
          React.createElement(CartesianGrid,gridStyle),
          React.createElement(XAxis,{dataKey:"date",tick:tickStyle}),
          React.createElement(YAxis,{tick:tickStyle}),
          React.createElement(Tooltip,tooltipStyle),
          React.createElement(Line,{type:"monotone",dataKey:"最大重量",stroke:"#4fc3f7",strokeWidth:2.5,dot:{r:4,fill:"#4fc3f7"},activeDot:{r:6}})))));
}

function App(){
  const [tab,setTab]=useState("record");
  const [data,setData]=useState(loadData);
  function refresh(){setData(loadData())}
  function handleDelete(id){const next=data.filter(r=>r.id!==id);saveData(next);setData(next)}
  const tabs=[{id:"record",label:"記録",icon:"✚"},{id:"history",label:"履歴",icon:"📋"},{id:"chart",label:"グラフ",icon:"📈"}];
  return React.createElement(React.Fragment,null,
    React.createElement("style",null,`
      .app{max-width:480px;margin:0 auto;padding-bottom:88px}
      .header{padding:28px 20px 16px;display:flex;align-items:baseline;gap:10px}
      .header-logo{font-family:'Bebas Neue',sans-serif;font-size:2rem;letter-spacing:3px;color:#e8a020;line-height:1}
      .header-sub{font-size:.7rem;color:#666;letter-spacing:1px;text-transform:uppercase}
      .header-count{margin-left:auto;font-size:.75rem;color:#555}
      .card{background:#13131f;border:1px solid #1e1e30;border-radius:14px;padding:20px;margin:0 16px 16px}
      .card-header{display:flex;align-items:center;gap:8px;margin-bottom:18px}
      .card-icon{width:28px;height:28px;background:#e8a020;color:#0d0d14;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:bold;flex-shrink:0}
      .card-title{font-size:.95rem;font-weight:700;color:#ddd;letter-spacing:.5px}
      .field-group{display:flex;flex-direction:column;gap:5px}
      .field-label{font-size:.72rem;color:#888;letter-spacing:.5px}
      .unit{color:#666;font-size:.7rem}
      .field-input{width:100%;background:#0d0d14;border:1px solid #252535;border-radius:8px;padding:10px 12px;color:#e8e8f0;font-size:.95rem;font-family:inherit;outline:none;transition:border-color .2s}
      .field-input:focus{border-color:#e8a020}
      .field-input::placeholder{color:#3a3a4a}
      input[type=number]::-webkit-inner-spin-button{opacity:.3}
      .suggest-list{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#1a1a2e;border:1px solid #2a2a40;border-radius:10px;overflow:hidden;z-index:100;list-style:none;box-shadow:0 8px 24px rgba(0,0,0,.5)}
      .suggest-item{padding:10px 14px;font-size:.88rem;cursor:pointer;display:flex;align-items:center;gap:8px;transition:background .15s}
      .suggest-item:hover{background:#21213a}
      .suggest-badge{font-size:.62rem;background:#e8a02022;color:#e8a020;border-radius:4px;padding:1px 5px;flex-shrink:0}
      .set-header-row{display:grid;grid-template-columns:24px 1fr 1fr 56px 28px;gap:8px;padding:0 0 4px;margin-bottom:2px}
      .set-col-label{font-size:.65rem;color:#555;text-align:center}
      .set-subtotal-label{text-align:right}
      .set-row{display:grid;grid-template-columns:24px 1fr 1fr 56px 28px;gap:8px;align-items:center;margin-bottom:8px}
      .set-num{font-family:'Bebas Neue',sans-serif;font-size:1rem;color:#e8a020;text-align:center;line-height:1}
      .set-input{padding:9px 8px;text-align:center}
      .set-subtotal{font-family:'Bebas Neue',sans-serif;font-size:1rem;color:#aaa;text-align:right;white-space:nowrap}
      .set-del-btn{background:none;border:none;color:#2a2a3a;cursor:pointer;font-size:.7rem;padding:4px;border-radius:4px;transition:color .2s}
      .set-del-btn:hover{color:#cc4444}
      .add-set-btn{width:100%;background:transparent;border:1px dashed #252535;border-radius:8px;color:#555;padding:9px;font-size:.82rem;font-family:inherit;cursor:pointer;margin:4px 0 14px;transition:all .2s;letter-spacing:.5px}
      .add-set-btn:hover{border-color:#e8a020;color:#e8a020}
      .total-bar{display:flex;justify-content:space-between;align-items:center;background:#0a0a12;border:1px solid #1e1e30;border-radius:10px;padding:12px 16px;margin-bottom:16px}
      .total-label{font-size:.8rem;color:#777}
      .total-value{font-family:'Bebas Neue',sans-serif;font-size:1.6rem;color:#e8a020;letter-spacing:1px}
      .save-btn{width:100%;background:#e8a020;color:#0d0d14;border:none;border-radius:10px;padding:13px;font-size:.95rem;font-weight:700;font-family:inherit;cursor:pointer;letter-spacing:1px;transition:all .2s}
      .save-btn:hover{background:#f0b030}
      .save-btn.saved{background:#2a7a2a;color:#7fff7f}
      .history-wrap{padding:0 16px}
      .day-group{margin-bottom:20px}
      .day-label{font-size:.72rem;color:#666;letter-spacing:1px;margin-bottom:8px;padding-left:4px;text-transform:uppercase}
      .history-card{background:#13131f;border:1px solid #1e1e30;border-radius:12px;padding:12px 14px;margin-bottom:8px}
      .hc-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
      .hc-exercise{font-size:.9rem;font-weight:700;color:#ddd;flex:1}
      .hc-total-val{font-family:'Bebas Neue',sans-serif;font-size:1.1rem;color:#e8a020}
      .del-btn{background:none;border:none;color:#333;cursor:pointer;font-size:.75rem;padding:2px 4px;border-radius:4px;transition:color .2s}
      .del-btn:hover{color:#cc4444}
      .hc-sets{display:flex;flex-direction:column;gap:4px}
      .hc-set-row{display:flex;align-items:center;gap:10px}
      .hc-set-num{font-size:.65rem;color:#555;width:34px;flex-shrink:0}
      .hc-set-detail{font-size:.82rem;color:#888;flex:1}
      .hc-set-sub{font-size:.78rem;color:#666}
      .charts-wrap{padding:0 16px}
      .exercise-pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
      .pill{background:#13131f;border:1px solid #1e1e30;border-radius:20px;padding:6px 14px;font-size:.78rem;color:#777;cursor:pointer;font-family:inherit;transition:all .2s}
      .pill:hover{border-color:#e8a020;color:#ddd}
      .pill-active{background:#e8a02018;border-color:#e8a020;color:#e8a020}
      .chart-card{padding:16px 16px 8px}
      .chart-title{font-size:.8rem;color:#888;margin-bottom:12px;letter-spacing:.3px}
      .chart-unit{color:#555}
      .empty-card{text-align:center;padding:40px 20px}
      .empty-icon{font-size:2.5rem;margin-bottom:12px;opacity:.4}
      .empty-text{font-size:.9rem;color:#666;margin-bottom:6px}
      .empty-sub{font-size:.75rem;color:#444}
      .bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#10101a;border-top:1px solid #1e1e30;display:flex;justify-content:center}
      .nav-btn{flex:1;max-width:160px;background:none;border:none;color:#444;padding:12px 0;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:3px;transition:color .2s}
      .nav-btn.active{color:#e8a020}
      .nav-icon{font-size:1.2rem}
      .nav-label{font-size:.65rem;letter-spacing:.5px}
      ::-webkit-scrollbar{width:4px}
      ::-webkit-scrollbar-track{background:transparent}
      ::-webkit-scrollbar-thumb{background:#222;border-radius:2px}
    `),
    React.createElement("div",{className:"app"},
      React.createElement("div",{className:"header"},
        React.createElement("span",{className:"header-logo"},"IRON LOG"),
        React.createElement("span",{className:"header-sub"},"筋トレ記録"),
        React.createElement("span",{className:"header-count"},data.length+" records")),
      tab==="record"&&React.createElement(RecordForm,{onSave:refresh}),
      tab==="history"&&React.createElement(History,{data,onDelete:handleDelete}),
      tab==="chart"&&React.createElement(Charts,{data})),
    React.createElement("nav",{className:"bottom-nav"},
      tabs.map(t=>React.createElement("button",{key:t.id,className:"nav-btn"+(tab===t.id?" active":""),onClick:()=>setTab(t.id)},
        React.createElement("span",{className:"nav-icon"},t.icon),
        React.createElement("span",{className:"nav-label"},t.label)))));
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
  </script>
</body>
</html>
